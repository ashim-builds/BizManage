version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bizmanage-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bizmanage
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bizmanage']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
