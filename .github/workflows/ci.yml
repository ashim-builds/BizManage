name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Install & Cache Dependencies
  # ────────────────────────────────────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Lint
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3: Type Check
  # ────────────────────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (required for type resolution)
        run: |
          pnpm --filter @bizmanage/database build
          pnpm --filter @bizmanage/types build
          pnpm --filter @bizmanage/validation build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bizmanage

      - name: Type-check API
        run: pnpm --filter @bizmanage/api build

      - name: Type-check Web
        run: pnpm --filter @bizmanage/web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4: Test (Integration Tests against real PostgreSQL)
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: install

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bizmanage_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @bizmanage/database build
          pnpm --filter @bizmanage/types build
          pnpm --filter @bizmanage/validation build
          pnpm --filter @bizmanage/api build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bizmanage_test

      - name: Run database migrations
        run: pnpm --filter @bizmanage/database exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bizmanage_test

      - name: Run integration tests
        run: node apps/api/dist/tests/run-all-tests.js
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bizmanage_test
          JWT_SECRET: test-secret-key-at-least-32-chars-long
          JWT_REFRESH_SECRET: test-refresh-secret-key-at-least-32-chars
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:3000

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 5: Production Build
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bizmanage
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000/api/v1' }}

      - name: Verify API dist output
        run: test -f apps/api/dist/server.js && echo "✅ API build verified"

      - name: Verify Web Next.js build
        run: test -d apps/web/.next && echo "✅ Web build verified"

      - name: Upload API build artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-dist
          path: apps/api/dist/
          retention-days: 7

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next/
          retention-days: 7
